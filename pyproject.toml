[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-computer-agent"
version = "0.1.0"
description = "Security-first foundation for a personal AI computer agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "playwright>=1.50,<2",
    "uvicorn>=0.34,<1",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
bolt = "agent_core.cli:main"
bolt-api = "agent_core.api_server:main"
bolt-auth = "agent_core.api_auth_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_core"]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
